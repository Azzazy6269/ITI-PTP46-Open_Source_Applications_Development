<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace — Home</title>
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b2545;
            --accent: #ff7a59;
            --muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.06);
            --radius: 12px;
            --gap: 1.25rem;
            --max-w: 1200px;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, Segoe UI, Roboto, Arial;
            background: linear-gradient(180deg, #07132a 0%, #071a2f 60%);
            color: #e6eef8;
            line-height: 1.45
        }

        .container {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 2rem
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .75rem
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #ffd08a);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35)
        }

        nav {
            display: flex;
            gap: 1rem;
            align-items: center
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            padding: .4rem .6rem;
            border-radius: 8px
        }

        nav a:hover {
            color: white;
            background: var(--glass)
        }

        .cta {
            background: linear-gradient(90deg, var(--accent), #ffb38a);
            color: #061022;
            padding: .5rem .9rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none
        }

        /* Hero */
        .hero {
            display: grid;
            grid-template-columns: 1fr 420px;
            align-items: center;
            gap: 2rem;
            padding: 3rem 0
        }

        .hero h1 {
            font-size: 2.1rem;
            margin: 0 0 .6rem;
            color: white
        }

        .sub {
            color: var(--muted);
            margin-bottom: 1.25rem
        }

        .actions {
            display: flex;
            gap: .75rem
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
            padding: 1.25rem;
            border-radius: var(--radius);
            box-shadow: 0 6px 30px rgba(3, 7, 18, 0.6)
        }

        .search-box {
            display: flex;
            gap: .5rem;
            align-items: center
        }

        .search-box input {
            flex: 1;
            padding: .6rem .8rem;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: inherit;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.04)
        }

        /* Features */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            margin: 2rem 0
        }

        .feature {
            padding: 1.1rem;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent);
            border: 1px solid rgba(255, 255, 255, 0.03)
        }

        .feature h3 {
            margin: .25rem 0;
            color: white
        }

        .feature p {
            color: var(--muted);
            margin: 0
        }

        /* Products grid */
        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem
        }

        .product {
            background: linear-gradient(180deg, #0e2238, #082033);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03)
        }

        .product img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px
        }

        .product h4 {
            margin: .6rem 0 0;
            color: #fff
        }

        .price {
            color: var(--accent);
            font-weight: 700
        }

        /* CTA and footer */
        .cta-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            margin-top: 2rem;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(255, 122, 89, 0.08), rgba(255, 179, 138, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.03)
        }

        footer {
            margin-top: 2.5rem;
            color: var(--muted);
            font-size: .95rem;
            padding-bottom: 2rem
        }

        /* Responsive */
        @media (max-width:1000px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .products {
                grid-template-columns: repeat(2, 1fr)
            }

            .features {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media (max-width:640px) {
            header {
                flex-direction: column;
                align-items: flex-start
            }

            .nav-toggle {
                display: block
            }

            .nav-links {
                display: none
            }

            .products {
                grid-template-columns: 1fr
            }

            .features {
                grid-template-columns: 1fr
            }

            .hero {
                padding: 1rem 0
            }
        }

        /* small helpers */
        .muted {
            color: var(--muted)
        }

        /* Table styles */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .data-table thead {
            background: rgba(255, 255, 255, 0.03);
            color: #e6eef8;
            font-weight: 600;
        }

        .data-table th,
        .data-table td {
            padding: .75rem .9rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            vertical-align: middle;
            font-size: .95rem;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .data-table td.row-actions {
            text-align: right;
            white-space: nowrap;
        }

        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.03);
            color: var(--accent);
            padding: .35rem .6rem;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-weight: 600;
        }

        .btn:hover {
            background: linear-gradient(90deg, var(--accent), #ffb38a);
            color: #061022;
        }

        /* Responsive table wrapper */
        @media (max-width: 720px) {
            .data-table,
            .data-table thead,
            .data-table tbody,
            .data-table th,
            .data-table td,
            .data-table tr {
                display: block;
            }

            .data-table thead {
                float: left;
            }

            .data-table tbody {
                width: auto;
                overflow-x: auto;
            }

            .data-table th,
            .data-table td {
                padding: .6rem .7rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="logo" aria-hidden="true"></div>
                <div>
                    <div style="font-weight:700">Marketplace</div>
                    <div class="muted" style="font-size:.85rem">Find curated products</div>
                </div>
            </div>
            <nav>
                <div class="nav-links">
                    <a href="/products/index">Products</a>
                    <a href="/aboutUs/land">About us</a>
                    <a href="/contactUs/land">Contact us</a>
                </div>
                <a class="cta" href="/products/land">Get Started</a>
            </nav>
        </header>
        <div style="color: rgb(255, 255, 255);">
            {% block content %}
            {% endblock %}
        </div>
        <div style="background-color: red;">
            {% block main %}
            {% endblock %}
        </div>
        <div >
            {% block body %}
            {% endblock %}
        </div>
        <footer>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
                <div>© <strong>Marketplace</strong> — All rights reserved.</div>
                <div class="muted">Designed with care • Built for shopkeepers</div>
            </div>
        </footer>

    </div>

    <script>
        // small helper: mobile nav toggle (progressive enhancement)
        (function () {
            var btn = document.querySelector('.nav-toggle');
            var links = document.querySelector('.nav-links');
            if (!btn || !links) return;
            btn.addEventListener('click', function () {
                links.style.display = links.style.display === 'block' ? 'none' : 'block';
            });
        })();
    </script>
</body>

</html>
